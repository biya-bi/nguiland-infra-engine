- op: add
  path: /spec/rules/-
  value:
    host: ${ACTIFACTORY_OSS_HOST}
    http:
      paths:
        - backend:
            service:
              name: artifactory-oss
              port:
                number: 8082
          path: /
          pathType: Prefix
- op: add
  path: /spec/tls/0/hosts/-
  value: ${ACTIFACTORY_OSS_HOST}
