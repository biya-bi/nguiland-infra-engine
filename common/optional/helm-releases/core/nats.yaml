apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: nats
      version: 2.14.*
      sourceRef:
        kind: HelmRepository
        name: nats
      interval: 5m
  releaseName: nats
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: false
  driftDetection:
    mode: enabled
  values:
    config:
      jetstream:
        enabled: true
        fileStore:
          enabled: true
          pvc:
            enabled: true
            size: 1Gi
        memoryStore:
          enabled: false
