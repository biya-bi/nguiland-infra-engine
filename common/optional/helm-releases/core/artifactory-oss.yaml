apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory-oss
  namespace: infra
spec:
  interval: 10m
  timeout: 10m
  dependsOn: []
  chart:
    spec:
      chart: org.nguiland.infra/artifactory-oss
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: artifactory-oci
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
