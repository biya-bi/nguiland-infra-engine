apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-gitrepository-tekton-trigger
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  chart:
    spec:
      chart: org.nguiland.infra/flux-gitrepository-tekton-trigger
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: artifactory-oci
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ${ARTIFACTORY_JCR_HOST}/docker-local/org.nguiland.infra/flux-gitrepository-tekton-trigger
