apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory-oss-snapshot-cleanup
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  dependsOn:
    - name: artifactory-oss
      namespace: ${ENVIRONMENT}
  chart:
    spec:
      chart: org.nguiland.infra/artifactory-oss-snapshot-cleanup
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: artifactory-oci
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ${ARTIFACTORY_JCR_HOST}/docker-local/org.nguiland.infra/alpine-ops-toolkit
    envMap:
      ART_OSS_URL: ${ARTIFACTORY_OSS_SCHEME}://${ARTIFACTORY_OSS_HOST}:${ARTIFACTORY_OSS_PORT}/artifactory
