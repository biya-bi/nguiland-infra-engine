apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: helm-chart-oci-publish
  namespace: infra
spec:
  providerRef:
    name: helm-chart-oci-publish
  eventSeverity: info
  eventMetadata:
    chartsDir: addons
    excludedCharts: cronjob-common
    registry: oci://artifactory-jcr.infra.svc.cluster.local:8082/docker-local
  eventSources:
    - kind: GitRepository
      name: helm
