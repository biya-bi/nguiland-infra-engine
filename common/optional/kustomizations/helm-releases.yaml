apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: optional-helm-releases
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  timeout: 10m
  dependsOn:
    - name: common
  path: ./common/optional/helm-releases
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: artifactory-oss
      namespace: ${ENVIRONMENT}
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: nats
      namespace: ${ENVIRONMENT}
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: nack
      namespace: ${ENVIRONMENT}
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: postgres
      namespace: ${ENVIRONMENT}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: env-settings
