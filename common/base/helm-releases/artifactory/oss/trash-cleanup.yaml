apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory-oss-trash-cleanup
  namespace: infra
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/artifactory/oss/trash-cleanup
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nguiland-infra-helm
      interval: 10m
  values:
    imagePullEndpoint: artifactory-jcr.infra
    artOssUrl: http://artifactory-oss:8082/artifactory
