apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory-jcr
  namespace: infra
spec:
  interval: 10m
  chart:
    spec:
      chart: artifactory-jcr
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: chart-repository
  values:
    replicaCount: 1
