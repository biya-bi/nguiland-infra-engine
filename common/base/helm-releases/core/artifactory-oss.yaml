apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory-oss
  namespace: infra
spec:
  interval: 10m
  chart:
    spec:
      chart: ./core/artifactory-oss
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: helm-core
      interval: 10m
  values:
    replicaCount: 1
