apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: infra
spec:
  interval: 10m
  timeout: 10m
  dependsOn:
    - name: chart-repository
      namespace: infra
  chart:
    spec:
      chart: keycloak
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: chart-repository
  values:
    replicaCount: 1
