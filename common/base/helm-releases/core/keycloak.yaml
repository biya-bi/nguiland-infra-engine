apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: infra
spec:
  interval: 10m
  dependsOn: []
  chart:
    spec:
      chart: org.nguiland.infra/keycloak
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: artifactory-oci
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
