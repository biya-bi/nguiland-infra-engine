apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chart-repository
  namespace: infra
spec:
  interval: 10m
  chart:
    spec:
      chart: ./core/chart-repository
      sourceRef:
        kind: GitRepository
        name: helm
      interval: 10m
  values:
    replicaCount: 1
