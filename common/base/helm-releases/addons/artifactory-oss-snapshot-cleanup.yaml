apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory-oss-snapshot-cleanup
  namespace: infra
spec:
  interval: 10m
  dependsOn:
    - name: artifactory-oss
      kind: HelmRelease
      group: helm.toolkit.fluxcd.io
      version: v2
      namespace: infra
  chart:
    spec:
      chart: ./addons/artifactory-oss-snapshot-cleanup
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nguiland-infra-helm-addons
      interval: 10m
  values:
    imagePullEndpoint: artifactory-jcr.infra
    artOssUrl: http://artifactory-oss:8082/artifactory
