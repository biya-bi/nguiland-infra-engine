apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory-oss-snapshot-cleanup
  namespace: infra
spec:
  interval: 10m
  dependsOn:
    - name: artifactory-oss
      namespace: infra
  chart:
    spec:
      chart: artifactory-oss-snapshot-cleanup
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: artifactory-oci
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: artifactory-jcr.infra/docker-local/org.nguiland.infra/alpine-ops-toolkit
    artOssUrl: http://artifactory-oss:8082/artifactory
