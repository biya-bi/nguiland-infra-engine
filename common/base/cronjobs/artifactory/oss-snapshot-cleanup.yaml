apiVersion: batch/v1
kind: CronJob
metadata:
  name: artifactory-oss-snapshot-cleanup
  namespace: infra
spec:
  schedule: "0 * * * *"

  # Prevent overlapping runs
  concurrencyPolicy: Forbid

  # Skip backlog executions
  startingDeadlineSeconds: 1800

  # Explicit
  suspend: false

  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      # Cleanup finished Jobs after ~55 minutes
      ttlSecondsAfterFinished: 3300

      # Limit retries of failed Jobs
      backoffLimit: 1

      template:
        spec:
          restartPolicy: OnFailure

          # Kill job if stuck >30min
          activeDeadlineSeconds: 1800

          # Graceful shutdown
          terminationGracePeriodSeconds: 30

          containers:
            - name: cleanup
              image: alpine:3.23

              # Resource control
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"

              env:
                - name: ART_URL
                  value: "http://artifactory-oss:8082/artifactory"
                - name: ART_USER
                  valueFrom:
                    secretKeyRef:
                      name: artifactory-oss
                      key: user
                - name: ART_PASS
                  valueFrom:
                    secretKeyRef:
                      name: artifactory-oss
                      key: password
                - name: REPO
                  value: "libs-snapshot-local"
                - name: KEEP
                  value: "5"
                - name: MAX_AGE_HOURS
                  value: "24"
                - name: DRY_RUN
                  value: "false"
                - name: MAX_PARALLEL
                  value: "5"
                - name: RETRIES
                  value: "3"

              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail

                  echo "=== Artifactory Snapshot Cleanup ==="
                  echo "Dry run: $DRY_RUN"

                  apk add --no-cache curl jq gawk coreutils

                  NOW_EPOCH=$(date +%s)
                  CUTOFF_EPOCH=$((NOW_EPOCH - MAX_AGE_HOURS * 3600))

                  # -----------------------------
                  # Query Artifactory
                  # -----------------------------
                  QUERY=$(cat <<EOF
                  items.find({
                    "repo": "$REPO"
                  }).include("repo","path","name","created")
                  EOF
                  )

                  echo "Running AQL query..."

                  curl -sS --fail --connect-timeout 10 --max-time 60 \
                    -u "$ART_USER:$ART_PASS" \
                    -X POST "$ART_URL/api/search/aql" \
                    -H "Content-Type: text/plain" \
                    -d "$QUERY" > result.json || {
                      echo "ERROR: curl failed"
                      exit 1
                    }

                  echo "---- RAW RESPONSE (first 20 lines) ----"
                  head -n 20 result.json
                  echo "---------------------------------------"

                  # -----------------------------
                  # Validate JSON response
                  # -----------------------------
                  if ! jq empty result.json >/dev/null 2>&1; then
                    echo "ERROR: Artifactory did not return valid JSON"
                    exit 1
                  fi

                  # -----------------------------
                  # Validate API response
                  # -----------------------------
                  if jq -e '.errors' result.json > /dev/null; then
                    echo "ERROR: Artifactory returned errors"
                    jq . result.json
                    exit 1
                  fi

                  # -----------------------------
                  # Normalize response
                  # -----------------------------
                  jq '
                    if (.results == null or (.results | type != "array")) then
                      .results = []
                    else
                      .
                    end
                  ' result.json > tmp.json && mv tmp.json result.json

                  TOTAL=$(jq '.results | length' result.json)
                  echo "Total artifacts returned: $TOTAL"

                  if [ "$TOTAL" -eq 0 ]; then
                    echo "No artifacts found. Exiting."
                    exit 0
                  fi

                  # -----------------------------
                  # Detect offenders (Always include all, ignore metadata)
                  # -----------------------------
                  jq -r '
                    .results[]
                    | select(.name != "maven-metadata.xml")
                    | .path
                  ' result.json | sort -u > offenders.txt

                  OFFENDER_COUNT=$(grep -c . offenders.txt || true)
                  echo "Artifacts requiring cleanup: $OFFENDER_COUNT"

                  if [ "$OFFENDER_COUNT" -eq 0 ]; then
                    echo "No cleanup required."
                    exit 0
                  fi

                  echo "---- DEBUG: offender paths ----"
                  cat offenders.txt
                  echo "--------------------------------"

                  # -----------------------------
                  # Build-aware cleanup
                  # -----------------------------
                  jq -r --rawfile offenders offenders.txt '
                    .results[]
                    | select(.name != "maven-metadata.xml")
                    | select(.path as $p | ($offenders | split("\n") | map(select(length > 0)) | index($p)))
                    | .created_epoch = (
                        try (.created | split(".")[0] + "Z" | fromdateiso8601)
                        catch 0
                      )
                    | "\(.path)|\(.name)|\(.created_epoch)"
                  ' result.json \
                  | gawk -F'|' '
                  function extract_build(name) {
                    if (match(name, /[0-9]{8}\.[0-9]{6}-[0-9]+/)) {
                      return substr(name, RSTART, RLENGTH)
                    }
                    return "UNKNOWN"
                  }
                  function is_complete(key) {
                    return file_count[key] >= 2
                  }
                  {
                    path=$1
                    name=$2
                    epoch=$3

                    # SAFETY: skip invalid timestamps
                    if (epoch == 0) next

                    build=extract_build(name)

                    # SAFETY: skip malformed builds
                    if (build == "UNKNOWN") next

                    key=path "|" build

                    if (!(key in seen)) {
                      seen[key]=1
                      build_count[path]++
                      build_order[path, build_count[path]] = build
                    }

                    file_count[key]++
                    files[key] = files[key] "\n" path "/" name

                    if (epoch > build_time[key]) {
                      build_time[key] = epoch
                    }
                  }
                  END {
                    for (p in build_count) {

                      # SAFETY: do nothing if too few builds
                      if (build_count[p] <= KEEP) continue

                      # sort builds by recency
                      for (i=1; i<=build_count[p]; i++) {
                        for (j=i+1; j<=build_count[p]; j++) {
                          b1=build_order[p,i]
                          b2=build_order[p,j]

                          if (build_time[p "|" b2] > build_time[p "|" b1]) {
                            tmp=build_order[p,i]
                            build_order[p,i]=build_order[p,j]
                            build_order[p,j]=tmp
                          }
                        }
                      }

                      for (i=1; i<=build_count[p]; i++) {
                        build=build_order[p,i]
                        key=p "|" build

                        if (i == 1) continue   # ALWAYS keep latest build
                        if (i <= KEEP) continue

                        # SAFETY: skip incomplete builds
                        if (!is_complete(key)) continue

                        # SAFETY: respect age threshold
                        if (build_time[key] > '"$CUTOFF_EPOCH"') continue

                        print files[key]
                      }
                    }
                  }' \
                  | grep -v '^$' \
                  | sort -u > delete.txt   # SAFETY: deduplicate

                  DELETE_COUNT=$(grep -c . delete.txt || true)
                  echo "Files to delete: $DELETE_COUNT"

                  if [ "$DELETE_COUNT" -eq 0 ]; then
                    echo "Nothing to delete."
                    exit 0
                  fi

                  echo "---- DEBUG: files selected for deletion ----"
                  cat delete.txt
                  echo "--------------------------------------------"

                  if [ "$DRY_RUN" = "true" ]; then
                    echo "[DRY RUN] Skipping deletion."
                    exit 0
                  fi

                  # -----------------------------
                  # Parallel deletion with retry
                  # -----------------------------
                  echo "Starting parallel deletion..."

                  cat delete.txt | grep -v '^$' | \
                    xargs -I {} -P $MAX_PARALLEL sh -c '
                      FILE="$1"

                      # SAFETY: avoid dangerous deletes
                      if echo "$FILE" | grep -q "\.\."; then
                        echo "Skipping suspicious path: $FILE"
                        exit 0
                      fi

                      for i in $(seq 1 '"$RETRIES"'); do
                        echo "Deleting $FILE (attempt $i)"
                        if curl -sf --connect-timeout 10 --max-time 60 \
                          -u "'"$ART_USER:$ART_PASS"'" \
                          -X DELETE "'"$ART_URL/$REPO"'/$FILE"; then
                          echo "Deleted $FILE"
                          exit 0
                        fi
                        sleep $((i * 2))
                      done
                      echo "FAILED to delete $FILE" >&2
                      exit 1
                    ' _ {}

                  echo "Cleanup complete."
