apiVersion: batch/v1
kind: CronJob
metadata:
  name: artifactory-oss-snapshot-cleanup
  namespace: infra
spec:
  schedule: "0 * * * *"

  # Prevent overlapping runs
  concurrencyPolicy: Forbid

  # Skip backlog executions
  startingDeadlineSeconds: 1800

  # Explicit
  suspend: false

  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      # Cleanup finished Jobs after ~55 minutes
      ttlSecondsAfterFinished: 3300

      # Limit retries of failed Jobs
      backoffLimit: 1

      template:
        spec:
          restartPolicy: OnFailure

          # Kill job if stuck >30min
          activeDeadlineSeconds: 1800

          # Graceful shutdown
          terminationGracePeriodSeconds: 30

          containers:
            - name: cleanup
              image: alpine:3.23

              # Resource control
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"

              env:
                - name: ART_URL
                  value: "http://artifactory-oss:8082/artifactory"
                - name: ART_USER
                  valueFrom:
                    secretKeyRef:
                      name: artifactory-oss
                      key: user
                - name: ART_PASS
                  valueFrom:
                    secretKeyRef:
                      name: artifactory-oss
                      key: password
                - name: REPO
                  value: "libs-snapshot"
                - name: KEEP
                  value: "5"
                - name: MAX_SNAPSHOTS
                  value: "20"
                - name: MAX_AGE_HOURS
                  value: "24"
                - name: DRY_RUN
                  value: "false"
                - name: MAX_PARALLEL
                  value: "5"
                - name: RETRIES
                  value: "3"

              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail

                  echo "=== Artifactory Snapshot Cleanup ==="
                  echo "Dry run: $DRY_RUN"

                  apk add --no-cache curl jq gawk coreutils

                  NOW_EPOCH=$(date +%s)
                  CUTOFF_EPOCH=$((NOW_EPOCH - MAX_AGE_HOURS * 3600))

                  # -----------------------------
                  # Query Artifactory
                  # -----------------------------
                  QUERY=$(cat <<EOF
                  items.find({
                    "repo": "$REPO"
                  }).include("repo","path","name","created")
                  EOF
                  )

                  curl -s --connect-timeout 10 --max-time 60 \
                    -u "$ART_USER:$ART_PASS" \
                    -X POST "$ART_URL/api/search/aql" \
                    -H "Content-Type: text/plain" \
                    -d "$QUERY" > result.json

                  # -----------------------------
                  # Validate API response
                  # -----------------------------
                  if jq -e '.errors' result.json > /dev/null; then
                    echo "ERROR: Artifactory returned errors"
                    jq . result.json
                    exit 1
                  fi

                  # -----------------------------
                  # Normalize response
                  # -----------------------------
                  jq '
                    if (.results == null or (.results | type != "array")) then
                      .results = []
                    else
                      .
                    end
                  ' result.json > tmp.json && mv tmp.json result.json

                  TOTAL=$(jq '.results | length' result.json)
                  echo "Total artifacts returned: $TOTAL"

                  if [ "$TOTAL" -eq 0 ]; then
                    echo "No artifacts found. Exiting."
                    exit 0
                  fi

                  echo "---- Timestamp Parse Errors (if any) ----"

                  # -----------------------------
                  # Detect offenders (threshold OR age)
                  # -----------------------------
                  jq -r --argjson cutoff "$CUTOFF_EPOCH" '
                    .results
                    | sort_by(.path)
                    | group_by(.path)
                    | map({
                        path: .[0].path,
                        count: length,
                        oldest: (
                          map(
                            try (.created | split(".")[0] + "Z" | fromdateiso8601)
                            catch (
                              ("PARSE_ERROR|" + .path + "/" + .name + "|" + .created) | @stderr
                              | 0
                            )
                          ) | min
                        )
                      })
                    | map(select(
                        (.count > '"$MAX_SNAPSHOTS"') or
                        (.oldest < $cutoff)
                      ))
                    | .[].path
                  ' result.json > offenders.txt

                  OFFENDER_COUNT=$(grep -c . offenders.txt || true)
                  echo "Artifacts requiring cleanup: $OFFENDER_COUNT"

                  if [ "$OFFENDER_COUNT" -eq 0 ]; then
                    echo "No cleanup required."
                    exit 0
                  fi

                  cat offenders.txt

                  # -----------------------------
                  # Build-aware cleanup
                  # -----------------------------
                  jq -r --rawfile offenders offenders.txt '
                    .results[]
                    | select(.path as $p | ($offenders | split("\n") | map(select(length > 0)) | index($p)))
                    | .created_epoch = (
                        try (.created | split(".")[0] + "Z" | fromdateiso8601)
                        catch (
                          ("PARSE_ERROR|" + .path + "/" + .name + "|" + .created) | @stderr
                          | 0
                        )
                      )
                    | "\(.path)|\(.name)|\(.created_epoch)"
                  ' result.json \
                  | gawk -F'|' '
                  function extract_build(name) {
                    if (match(name, /[0-9]{8}\.[0-9]{6}-[0-9]+/)) {
                      return substr(name, RSTART, RLENGTH)
                    }
                    return "UNKNOWN"
                  }
                  {
                    print $1 "|" extract_build($2) "|" $1 "|" $2 "|" $3
                  }' \
                  | sort -t'|' -k1,1 -k2,2 -k5,5nr \
                  | gawk -F'|' -v KEEP=$KEEP -v CUTOFF=$CUTOFF_EPOCH '
                  {
                    key=$1
                    build=$2
                    path=$3
                    name=$4
                    epoch=$5

                    build_key=key "|" build

                    if (!(build_key in seen)) {
                      seen[build_key]=1
                      build_count[key]++
                      build_order[key, build_count[key]] = build
                    }

                    files[build_key] = files[build_key] "\n" path "/" name

                    if (epoch > build_time[build_key]) {
                      build_time[build_key] = epoch
                    }
                  }
                  END {
                    for (k in seen) {
                      split(k, parts, "|")
                      key = parts[1]
                      build = parts[2]

                      idx = -1
                      for (i = 1; i <= build_count[key]; i++) {
                        if (build_order[key, i] == build) {
                          idx = i
                          break
                        }
                      }

                      if (idx == 1) continue
                      if (idx <= KEEP) continue

                      if (build_time[k] < CUTOFF) {
                        print files[k]
                        continue
                      }

                      print files[k]
                    }
                  }' > delete.txt

                  DELETE_COUNT=$(grep -c . delete.txt || true)
                  echo "Files to delete: $DELETE_COUNT"

                  if [ "$DELETE_COUNT" -eq 0 ]; then
                    echo "Nothing to delete."
                    exit 0
                  fi

                  cat delete.txt

                  if [ "$DRY_RUN" = "true" ]; then
                    echo "[DRY RUN] Skipping deletion."
                    exit 0
                  fi

                  # -----------------------------
                  # Parallel deletion with retry
                  # -----------------------------
                  echo "Starting parallel deletion..."

                  cat delete.txt | grep -v '^$' | \
                    xargs -I {} -P $MAX_PARALLEL sh -c '
                      FILE="$1"
                      for i in $(seq 1 '"$RETRIES"'); do
                        echo "Deleting $FILE (attempt $i)"
                        if curl -sf --connect-timeout 10 --max-time 60 \
                          -u "'"$ART_USER:$ART_PASS"'" \
                          -X DELETE "'"$ART_URL/$REPO"'/$FILE"; then
                          echo "Deleted $FILE"
                          exit 0
                        fi
                        sleep $((i * 2))
                      done
                      echo "FAILED to delete $FILE" >&2
                      exit 1
                    ' _ {}

                  echo "Cleanup complete."
