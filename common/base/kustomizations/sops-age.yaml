apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sops-age
  namespace: ${ENVIRONMENT}
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 30m0s
  path: ./${ENVIRONMENT}/sops-age
  prune: true
  sourceRef:
    kind: GitRepository
    name: nguiland-ops-secrets
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: env-settings
