apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ostock
  namespace: ${ENVIRONMENT}
spec:
  dependsOn:
    - name: sops-age
  interval: 10m0s
  path: ./overlays/${ENVIRONMENT}
  prune: true
  sourceRef:
    kind: GitRepository
    name: ostock
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: env-settings
