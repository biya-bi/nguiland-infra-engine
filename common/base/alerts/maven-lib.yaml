apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: maven-lib
  namespace: infra
spec:
  providerRef:
    name: maven-lib
  eventSeverity: info
  eventMetadata:
    contextDir: '.'
  eventSources:
    - kind: GitRepository
      name: io-utils
    - kind: GitRepository
      name: dependencies
    - kind: GitRepository
      name: web-oauth2
    - kind: GitRepository
      name: ms-parent
    - kind: GitRepository
      name: rest
