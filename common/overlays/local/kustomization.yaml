apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../optional

patches:
  - patch: |-
      - op: remove
        path: /spec/tls
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: nguiland
      namespace: infra
  - patch: |-
      - op: add
        path: /spec/insecure
        # We are on a cluster on our local development machine, so we can allow insecure connections to the registry,
        # which is assumed to be local as well. We shouldn't have to worry about certificates in this case, and this
        # allows us to avoid the complexity of setting up a local certificate authority and issuing certificates for
        # our local registry. In upper environments, we will have a valid certificate for the registry, so this patch
        # have not been included in other overlays.
        value: true
    target:
      kind: HelmRepository
      name: artifactory-oci
      namespace: infra
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: postgres
          namespace: infra
    target:
      kind: HelmRelease
      name: artifactory-jcr
      namespace: infra
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: postgres
          namespace: infra
    target:
      kind: HelmRelease
      name: artifactory-oss
      namespace: infra
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: postgres
          namespace: infra
    target:
      kind: HelmRelease
      name: keycloak
      namespace: infra
