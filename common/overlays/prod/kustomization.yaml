apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/ref/branch
        value: main
    target:
      kind: GitRepository
  - patch: |-
      - op: replace
        path: /spec/values/replicaCount
        value: 2
    target:
      kind: HelmRelease
