apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../optional

patches:
  - patch: |-
      - op: replace
        path: /spec/values/envMap/SYSTEM_NAMES
        value: jcr oss
    target:
      kind: HelmRelease
      name: artifactory-data-cleanup
      namespace: ${ENVIRONMENT}
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: postgres
          namespace: ${ENVIRONMENT}
    target:
      kind: HelmRelease
      name: artifactory-jcr
      namespace: ${ENVIRONMENT}
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: postgres
          namespace: ${ENVIRONMENT}
    target:
      kind: HelmRelease
      name: artifactory-oss
      namespace: ${ENVIRONMENT}
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: postgres
          namespace: ${ENVIRONMENT}
    target:
      kind: HelmRelease
      name: keycloak
      namespace: ${ENVIRONMENT}
