apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: init
  namespace: infra
spec:
  interval: 10m0s
  path: ./bootstrap/overlays/${ENVIRONMENT} # Replace ${ENVIRONMENT} in overlays
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
