apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: common
  namespace: infra
spec:
  dependsOn:
    - name: core
  interval: 10m0s
  path: ./common/overlays/${ENVIRONMENT}
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ingress-nginx-controller
      namespace: infra
    - apiVersion: apps/v1
      kind: Deployment
      name: kyverno-admission-controller
      namespace: kyverno
  postBuild:
    substitute:
      ENVIRONMENT: ${ENVIRONMENT}
      ACTIFACTORY_JCR_HOST: ${ACTIFACTORY_JCR_HOST}
      ACTIFACTORY_OSS_HOST: ${ACTIFACTORY_OSS_HOST}
      IMAGE_PULL_ENDPOINT: ${ACTIFACTORY_JCR_HOST}
      IMAGE_PUSH_ENDPOINT: ${ACTIFACTORY_JCR_HOST}
      KEYCLOAK_HOST: ${KEYCLOAK_HOST}
      OSTOCK_ANGULAR_FRONTEND_HOST: ${OSTOCK_ANGULAR_FRONTEND_HOST}
      OSTOCK_GATEWAY_SERVICE_HOST: ${OSTOCK_GATEWAY_SERVICE_HOST}
