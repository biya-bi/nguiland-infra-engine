apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: common
  namespace: ${ENVIRONMENT}
spec:
  dependsOn:
    - name: core
  interval: 10m0s
  path: ./common/overlays/${ENVIRONMENT}
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ingress-nginx-controller
      namespace: ${ENVIRONMENT}
    - apiVersion: apps/v1
      kind: Deployment
      name: kyverno-admission-controller
      namespace: kyverno
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: env-settings

