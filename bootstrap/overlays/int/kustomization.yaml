apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: env-settings
    namespace: ${ENVIRONMENT}
    literals:
      - ENVIRONMENT=${ENVIRONMENT}
      - ARTIFACTORY_JCR_HOST=int-jcr.nguiland.org
      - ARTIFACTORY_JCR_PORT="443"
      - ARTIFACTORY_OSS_HOST=int-oss.nguiland.org
      - ARTIFACTORY_OSS_PORT="443"
      - ARTIFACTORY_OSS_SCHEME=https
      - KEYCLOAK_HOST=int-keycloak.nguiland.org
      - OSTOCK_ANGULAR_FRONTEND_HOST=int-ostockweb.nguiland.org
      - OSTOCK_GATEWAY_SERVICE_HOST=int-ostockapi.nguiland.org
generatorOptions:
  disableNameSuffixHash: true
