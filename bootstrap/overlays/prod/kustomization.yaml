apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: env-settings
    namespace: ${ENVIRONMENT}
    literals:
      - ENVIRONMENT=${ENVIRONMENT}
      - ACTIFACTORY_JCR_HOST=jcr.nguiland.org
      - ACTIFACTORY_JCR_PORT="443"
      - ACTIFACTORY_OSS_HOST=""
      - ACTIFACTORY_OSS_PORT=""
      - ACTIFACTORY_OSS_SCHEME=""
      - KEYCLOAK_HOST=keycloak.nguiland.org
      - OSTOCK_ANGULAR_FRONTEND_HOST=ostockng.nguiland.org
      - OSTOCK_GATEWAY_SERVICE_HOST=ostockapi.nguiland.org
generatorOptions:
  disableNameSuffixHash: true
