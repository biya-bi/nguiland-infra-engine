apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: env-settings
    literals:
      - ENVIRONMENT=${ENVIRONMENT}
      - ARTIFACTORY_JCR_HOST=artifactory-jcr.${ENVIRONMENT}
      - ARTIFACTORY_JCR_PORT="8082"
      - ARTIFACTORY_OSS_HOST=artifactory-oss.${ENVIRONMENT}
      - ARTIFACTORY_OSS_PORT="8082"
      - ARTIFACTORY_OSS_SCHEME=http
      - KEYCLOAK_HOST=keycloak.${ENVIRONMENT}
      - OSTOCK_ANGULAR_FRONTEND_HOST=angular-frontend.ostock
      - OSTOCK_GATEWAY_SERVICE_HOST=gateway-service.ostock
generatorOptions:
  disableNameSuffixHash: true
