apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap
  namespace: local
spec:
  interval: 10m0s
  path: ./bootstrap/overlays/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: flux-system
      namespace: flux-system
  postBuild:
    substitute:
      ENVIRONMENT: local
