apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap
  namespace: infra
spec:
  interval: 10m0s
  path: ./bootstrap/overlays/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      ENVIRONMENT: local
      ACTIFACTORY_JCR_HOST: artifactory-jcr.infra
      ACTIFACTORY_OSS_HOST: artifactory-oss.infra
      KEYCLOAK_HOST: keycloak.infra
      OSTOCK_ANGULAR_FRONTEND_HOST: angular-frontend.ostock
      OSTOCK_GATEWAY_SERVICE_HOST: gateway-service.ostock
