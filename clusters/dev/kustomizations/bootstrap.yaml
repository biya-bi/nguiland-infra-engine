apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap
  namespace: infra
spec:
  interval: 10m0s
  path: ./bootstrap/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      ENVIRONMENT: dev
      ACTIFACTORY_JCR_HOST: dev-jcr.nguiland.org
      ACTIFACTORY_OSS_HOST: ""
      KEYCLOAK_HOST: dev-keycloak.nguiland.org
      OSTOCK_ANGULAR_FRONTEND_HOST: dev-ostockng.nguiland.org
      OSTOCK_GATEWAY_SERVICE_HOST: dev-ostockapi.nguiland.org
